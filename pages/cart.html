    <main>
        <section>
            <h2>Mon Panier</h2>

            <table border="1">

                    <tr>

                        <th scope="col">Produit</th>
                        <th scope="col">Prix</th>
                        <th scope="col">Quantité</th>
                        <th scope="col">Total</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Chemise</td>
                        <td>20</td>
                        <td>1</td>
                        <td>20</td>
                        <td>
                            <button type="button">Supprimer</button>

                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Robe</td>
                        <td>15</td>
                        <td>2</td>
                        <td>30</td>
                        <td>
                            <button type="button">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">Total</td>
                        <td>50</td>
                        <td>
                            <button type="button">Commander</button>
                        </td>
                    </tr>

        <!-- download : Télévharger automatiquement le pdf -->

        <a href="assets/pdf/Mentions légales.pdf" download="document.pdf">Mentions Légales</a>
